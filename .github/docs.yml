name: docs

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']   # la documentation suit les versions : rien sur main
  workflow_dispatch:                  # republication manuelle

permissions:
  contents: read

concurrency:                        # un seul déploiement Pages à la fois
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Installation de MkDocs
        run: pip install mkdocs        # + thème et plugins déclarés dans mkdocs.yml
      - name: Construction du site
        run: mkdocs build              # site généré dans site/
      - uses: actions/configure-pages@v6
      - name: Publication du site comme artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write                  # déployer sur GitHub Pages
      id-token: write               # prouver l'origine du déploiement
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v5