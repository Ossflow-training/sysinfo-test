name: mysystem

on:
  push:
    branches: ['feature/**']       # jamais sur un tag
    paths:
      - 'script/mysystem/**'
      - '.github/workflows/mysystem.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'                                          # active le cache pip
          cache-dependency-path: script/mysystem/requirements.txt
      - name: Dépendances
        run: pip install -r script/mysystem/requirements.txt pylint
      - name: Lint
        run: pylint --disable=missing-docstring script/mysystem/mysystem.py

  run:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'                                          # active le cache pip
          cache-dependency-path: script/mysystem/requirements.txt
      - name: Dépendances
        run: pip install -r script/mysystem/requirements.txt
      - name: Exécution
        run: python script/mysystem/mysystem.py

  unit:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write                           # pour publier le rapport de tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'                                          # active le cache pip
          cache-dependency-path: script/mysystem/requirements.txt
      - name: Dépendances
        run: pip install -r script/mysystem/requirements.txt pytest
      - name: Tests unitaires
        run: pytest --junitxml=report.xml
      - name: Rapport de tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: report.xml
          detailed_summary: true     # tableau test par test dans le résumé du run
          include_passed: true       # lister aussi les tests réussis